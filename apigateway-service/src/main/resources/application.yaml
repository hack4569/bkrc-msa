server:
  port: 8000

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka

spring:
  application:
    name: apigateway-service
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: like-service
              uri: http://localhost:8081/
              predicates:
                - Path=/like/**