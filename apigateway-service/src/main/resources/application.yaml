server:
  port: 8000

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka

spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  application:
    name: apigateway-service
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service-login
              uri: lb://USER-SERVICE
              predicates:
                - Path=/user-service/login
              filters:
                - StripPrefix=1
            - id: user-service-openapi
              uri: lb://USER-SERVICE
              predicates:
                - Path=/user-service/v3/api-docs/**
              filters:
                - StripPrefix=1
            - id: history-service-openapi
              uri: lb://HISTORY-SERVICE
              predicates:
                - Path=/history-service/v3/api-docs/**
              filters:
                - StripPrefix=1
            - id: aladin-service-openapi
              uri: lb://ALADIN-SERVICE
              predicates:
                - Path=/aladin-service/v3/api-docs/**
              filters:
                - StripPrefix=1
            - id: aladin-service
              uri: lb://ALADIN-SERVICE
              predicates:
                - Path=/aladin-service/**
            - id: history-service
              uri: lb://HISTORY-SERVICE
              predicates:
                - Path=/history-service/**
            - id: like-service
              uri: lb://LIKE-SERVICE
              predicates:
                - Path=/like-service/**
            - id: user-service
              uri: lb://USER-SERVICE
              predicates:
                - Path=/user-service/**

token:
  secret: ${JWT_SECRET}

springdoc:
  swagger-ui:
    urls:
      - name: user-service
        url: /user-service/v3/api-docs
      - name: history-service
        url: /history-service/v3/api-docs
      - name: aladin-service
        url: /aladin-service/v3/api-docs
