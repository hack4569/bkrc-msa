server:
  port: 8084

spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  application:
    name: aladin-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${ALADIN_DB_URL:${DB_URL:jdbc:mysql://localhost:3306/book_recommend?serverTimezone=UTC&useUnicode=true&characterEncoding=utf-8}}
    username: ${ALADIN_DB_USERNAME:${DB_USERNAME:root}}
    password: ${ALADIN_DB_PASSWORD:${DB_PASSWORD}}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

aladin:
  host: https://www.aladin.co.kr
  ttbkey: ${ALADIN_API_KEY}

external-api:
  aladin:
    connect-timeout: 3s
    read-timeout: 5s

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    instance-id: ${spring.cloud.client.ip-address}:${spring.application.instance_id:${random.value}}
    prefer-ip-address: true

resilience4j:
  circuitbreaker:
    instances:
      aladin:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
  retry:
    instances:
      aladin:
        max-attempts: 2
        wait-duration: 200ms

springdoc:
  swagger-ui:
    url: /aladin-service/v3/api-docs

openapi:
  server-url: ${OPENAPI_SERVER_URL:http://localhost:8000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
